  experiment_order: "TF-IDF floor + MiniLM/SetFit -> BioClinical-ModernBERT (3 seeds) -> ModernBERT control -> Ettin-32M -> Qwen3-0.6B LoRA -> Qwen3.5-0.8B -> distillation only if justified"
  design_contract: "research/pipeline-design.md (v0.9.1, 2026-10-28) — architecture stages 0-9, study queue S-1..S-24 (S-7/S-9/S-11/S-12/S-13 full texts ingested; S-10 closed as resolved-in-S-9), boundary tests B1-B11, smoke experiments E0-E4 (E2 = Wright synthetic benchmark, located), harmonization register §9-4.3, risks R1-R7; all implementation must conform and print deviations to research-log.md"
  design_method: "brainstorming-research-ideas frameworks F1-F10 applied; 6 tensions, fault-injection matrix, stakeholder rotation, simplicity-test arm justification"

