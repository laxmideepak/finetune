  last_direction: "Design-research pass complete: pipeline-design.md v0.9 (10 stages, 6 tensions reconciled, 11 boundary tests, 20-item study queue S-1..S-20 with 10 more ingested this pass incl. ModernBERT blog, TRL SFT docs, MiniLM card — all verified first-hand). Awaiting 4 ratifications (§15) + smoke wave E0-E4 (zero-DUA) before implementation wave 1."
  last_reflection: "2019-2026 literature converged on our architecture (sentence/snippet-level + rules/aggregate, deployed examples 0.94-0.99 F1); our delta is the cost frontier ($/M quantified vs 2026 cloud $120-6,610/M) + conservative-UNKNOWN crop-label discipline + patient-disjoint controlled comparison. Teacher route upgraded to privately-hosted gpt-oss-20B (verified 0.99 F1 tobacco zero-shot, JAMIA Open 2026)."

