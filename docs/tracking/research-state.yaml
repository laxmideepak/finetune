    - "SHAC full (JBI 2021 PMC7856628 + ocad012 PMC10354764): tobacco Status {none,current,past} + Duration/History/Type/Amount/Frequency; 4,480(2021)->4,405(2022 harmonized); trigger kappa 0.94-0.97; Subtask-B cross-domain drop 0.901->0.774 = risk R7; two-gated access (PhysioNet + UW DUA) confirmed"
