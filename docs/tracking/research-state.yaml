    - "HF Jobs GPU prices (2026-10-28): T4 $0.40, L4 $0.80, A10G $1.00, L40S $1.80, A100-80 $2.50, H200 $5.00, RTX PRO 6000-96GB $2.75/h; per-minute billing"
