    - "SmokeBERT (JCO CCI 2025, PMID 41325572): fine-tuned ClinicalBERT F1 0.97 holdout / 0.86 external on 6 quantitative smoking variables vs gpt-oss-20B 0.72-0.79 → teacher scope = 4-class status only; Palmer 2019 (PMID 31340796): status F1 0.90 on i2b2-2006 + local; regex quit-date 63.2% sens = the hard field; HHS de-id anchor: Expert Determination + Safe Harbor (reviewed 2025-02-03, via Wayback; direct 403)"
